[build-system]
requires = ["setuptools==79.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-daelab-creative-studio"
version = "0.1.0.dev0"
description = "Modular creative canvas, assets and generation for ComfyUI"
requires-python = ">=3.12"
dependencies = [
  "aiohttp>=3.14,<4", "av>=17,<18", "numpy>=2.3,<3", "Pillow>=12.2,<13",
  "python-docx>=1.2,<2", "openpyxl>=3.1,<4", "pdfplumber>=0.11.10,<1",
]

[project.urls]
Repository = "https://github.com/TeutonicMepheles/ComfyUI-DAELab-Creative-Studio"

# ComfyUI loads the package directory, not a wheel's top-level Python modules.
# Prevent setuptools from discovering frontend, node_modules or local data.
[tool.setuptools]
packages = []

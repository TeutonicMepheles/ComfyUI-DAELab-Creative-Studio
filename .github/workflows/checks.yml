name: Pure checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rules-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: python -m pip install -r tests/requirements.txt
      - run: npm run typecheck
      - run: npm run build
      - run: node tools/check_docs.mjs
      - run: node tools/check_architecture.mjs
      - run: node tools/verify_assets.mjs
      - run: npm test
      - run: npm run test:business
      - name: Independent table browser checks
        env:
          TABLE_BROWSER: chromium
        run: |
          npx playwright install --with-deps chromium
          npm run test:table:ui
      - run: python -m unittest discover -s tests/unit -p 'test_*.py' -v
      - run: python -m unittest discover -s tests/host -p 'test_*.py' -v
      - run: python -m unittest discover -s tests/backend -p 'test_*.py' -v
      - run: python -m unittest discover -s tests/review_backend -p 'test_*.py' -v
      - run: python -m unittest discover -s tests/migrated_canvas_backend -p 'test_*.py' -v
      - run: python -m unittest discover -s tests/migrated_business_backend -p 'test_*.py' -v
      - run: python -m unittest discover -s tests/evals -p 'test_*.py' -v
      - run: python -m unittest discover -s tests/generation -p 'test_*.py' -v
      - run: python -m unittest discover -s tests/media_export -p 'test_*.py' -v
      - name: Candidate archive contracts
        run: |
          python -m pip install setuptools==79.0.0 packaging==25.0
          python -m unittest discover -s tests/release -p 'test_*.py' -v
      - run: python -m unittest discover -s tests/host_fixture_tests -p 'test_*.py' -v
      - run: node tests/host_fixture_tests/test_generation_fixture_frontend.mjs
      - run: python -m unittest discover -s tests/migration -p 'test_*.py' -v
      - run: python -m unittest discover -s tests/performance -p 'test_*.py' -v
      - run: node --test tests/performance/*.test.mjs
      - run: node docs/migration-blueprint/render_catalog.mjs --check
      - run: node tools/evals/traceability.mjs --check
      # No GPU runner, provider credentials, real models or external PR execution on a local host.
